name: Security Checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # weekly scan (Monday 03:00 UTC) to catch newly published CVEs
  workflow_dispatch:
  workflow_call: # lets your deploy workflow call this one as a gate

# Least privilege: jobs only get what they need
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  # "1" = fail the pipeline on findings (enforce)
  # "0" = report only (use this first while you fix existing issues)
  EXIT_CODE: "0"
  SEVERITY: "HIGH,CRITICAL"

jobs:
  # ---------------------------------------------------------------
  # Tool 1: Gitleaks - hardcoded secrets (code + full git history)
  # ---------------------------------------------------------------
  gitleaks:
    name: Gitleaks (secret detection)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so old leaked secrets are found
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------
  # Tool 2: Semgrep - SAST for Node.js / React / Dockerfiles
  # ---------------------------------------------------------------
  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          ERR=""
          [ "$EXIT_CODE" = "1" ] && ERR="--error"
          semgrep scan \
            --config p/default \
            --config p/nodejs \
            --config p/javascript \
            --config p/react \
            --config p/dockerfile \
            --exclude node_modules --exclude dist \
            --sarif --output semgrep.sarif \
            $ERR
      - name: Upload SARIF to GitHub Security tab
        if: always()
        continue-on-error: true # code scanning needs a public repo or GitHub Advanced Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: semgrep.sarif

  # ---------------------------------------------------------------
  # Tool 3a: Trivy - source code, dependencies, secrets, IaC/Dockerfile
  # ---------------------------------------------------------------
  trivy-fs:
    name: Trivy (repo scan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (report)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: ${{ env.SEVERITY }}
          ignore-unfixed: true
          skip-dirs: node_modules,dist
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0"
      - name: Upload SARIF to GitHub Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - name: Trivy filesystem scan (gate)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: ${{ env.SEVERITY }}
          ignore-unfixed: true
          skip-dirs: node_modules,dist
          format: table
          exit-code: ${{ env.EXIT_CODE }}

  # ---------------------------------------------------------------
  # Tool 3b: Trivy - built Docker images (OS packages + app libraries)
  # ---------------------------------------------------------------
  trivy-image:
    name: Trivy image (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t novatable-${{ matrix.service }}:scan ./${{ matrix.service }}
      - name: Trivy image scan (report)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: novatable-${{ matrix.service }}:scan
          severity: ${{ env.SEVERITY }}
          ignore-unfixed: true
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          exit-code: "0"
      - name: Upload SARIF to GitHub Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}
      - name: Trivy image scan (gate)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: novatable-${{ matrix.service }}:scan
          severity: ${{ env.SEVERITY }}
          ignore-unfixed: true
          format: table
          exit-code: ${{ env.EXIT_CODE }}
